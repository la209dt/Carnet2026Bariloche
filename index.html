<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Verificación Alumno</title>

<style>
body{
margin:0;
font-family:Arial;
color:white;
}

.ok{
background:green;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.deuda{
background:red;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.estado{
font-size:80px;
font-weight:bold;
}

.nombre{
font-size:40px;
margin-top:20px;
}

.dni{
font-size:30px;
margin-top:10px;
}
</style>

</head>

<body>

<div id="resultado">
Cargando...
</div>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vToHCd9b22CYUpGzyfPB4g3n9BkJnezkKKmWwiHvcwNeZ2Cke83w9bnJ29CP9bMTvGqMQ4zTWOemF9Z/pub?output=csv";

const params=new URLSearchParams(window.location.search);
const dniBuscado=params.get("dni");

async function buscar(){

const res=await fetch(sheetURL);
const data=await res.text();

const filas=data.split("\n").slice(1);

for(let fila of filas){

const col=fila.split(",");

const nombre=col[1];
const dni=col[2].trim();
const estado=col[3].toLowerCase().trim();

if(dni == dniBuscado){

if(estado.includes("deudor")){

document.body.className="deuda";
document.getElementById("resultado").innerHTML=`
<div class="estado">DEUDOR ❌</div>
<div class="nombre">${nombre}</div>
<div class="dni">DNI: ${dni}</div>
`;

}else{

document.body.className="ok";
document.getElementById("resultado").innerHTML=`
<div class="estado">HABILITADO ✅</div>
<div class="nombre">${nombre}</div>
<div class="dni">DNI: ${dni}</div>
`;

}

return;

}

}

document.body.style.background="#333";
document.getElementById("resultado").innerHTML="Alumno no encontrado";

}

buscar();

</script>

</body>
</html>
